services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - medusa
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - bayblaze_api

  medusa:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MEDUSA_ADMIN_ONBOARDING_TYPE: ${MEDUSA_ADMIN_ONBOARDING_TYPE:-default}
      STORE_CORS: ${STORE_CORS:-http://localhost:3000,http://localhost:8000,https://docs.medusajs.com}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:5173,http://localhost:9000,https://docs.medusajs.com}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:3000,http://localhost:5173,http://localhost:9000,http://localhost:8000,https://docs.medusajs.com}
      DATABASE_URL: ${DATABASE_URL:-postgres://medusa:medusa@postgres:5432/medusa?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in /opt/bayblaze/medusa/.env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in /opt/bayblaze/medusa/.env}
      LABEL_PRINTER_AGENT_URL: ${LABEL_PRINTER_AGENT_URL:-http://100.76.159.4:4786}
      LABEL_PRINTER_AGENT_TOKEN: ${LABEL_PRINTER_AGENT_TOKEN:?Set LABEL_PRINTER_AGENT_TOKEN in /opt/bayblaze/medusa/.env}
      BAYBLAZE_STOREFRONT_URL: ${BAYBLAZE_STOREFRONT_URL:-https://bayblaze.net}
      BAYBLAZE_MEDUSA_SERVICE_TOKEN: ${BAYBLAZE_MEDUSA_SERVICE_TOKEN:-}
      BAYBLAZE_DRIVER_SERVICE_TOKEN: ${BAYBLAZE_DRIVER_SERVICE_TOKEN:-}
      BAYBLAZE_INVENTORY_SERVICE_TOKEN: ${BAYBLAZE_INVENTORY_SERVICE_TOKEN:-}
      BAYBLAZE_INVENTORY_IMAGE_UPLOAD_DIR: ${BAYBLAZE_INVENTORY_IMAGE_UPLOAD_DIR:-/app/uploads/bayblaze-inventory}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://bayblaze.net/api/auth/oauth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
    volumes:
      - ./uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-medusa} -d $${POSTGRES_DB:-medusa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  bayblaze_api:
    external: true
    name: bayblaze-api_default
