services:
  bayblaze-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bayblaze-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://medusa:9000}
    depends_on:
      medusa:
        condition: service_started
    ports:
      - "127.0.0.1:3040:3040"
    volumes:
      - ./uploads:/app/uploads

  medusa:
    build:
      context: ./medusa
    image: bayblaze-medusa:integrated
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      BAYBLAZE_INVENTORY_IMAGE_UPLOAD_DIR: ${BAYBLAZE_INVENTORY_IMAGE_UPLOAD_DIR:-/app/uploads/bayblaze-inventory}
      PORT: "9000"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "9000"
    volumes:
      - ./medusa/uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-medusa} -d $${POSTGRES_DB:-medusa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
