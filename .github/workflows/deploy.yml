name: Deploy BayBlaze API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bayblaze-api-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DEPLOY_DIR: /opt/bayblaze/bayblaze-api

jobs:
  deploy:
    name: Build and deploy on VPS
    runs-on:
      - self-hosted
      - Linux
      - X64
      - bayblaze-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Backfill unified env from legacy Medusa env
        run: |
          test -f "$DEPLOY_DIR/.env.production"

          LEGACY_ENV=""
          for candidate in /opt/bayblaze/medusa/.env.production /opt/bayblaze/medusa/.env; do
            if [ -f "$candidate" ]; then
              LEGACY_ENV="$candidate"
              break
            fi
          done

          if [ -n "$LEGACY_ENV" ]; then
            while IFS= read -r line; do
              case "$line" in
                ""|\#*) continue ;;
                *=*)
                  key="${line%%=*}"
                  if ! grep -q "^${key}=" "$DEPLOY_DIR/.env.production"; then
                    printf '\n%s\n' "$line" >> "$DEPLOY_DIR/.env.production"
                  fi
                  ;;
              esac
            done < "$LEGACY_ENV"
          fi

      - name: Verify production env exists
        run: |
          test -f "$DEPLOY_DIR/.env.production"
          grep -q '^DATABASE_URL=' "$DEPLOY_DIR/.env.production"
          grep -q '^POSTGRES_PASSWORD=' "$DEPLOY_DIR/.env.production"
          grep -q '^JWT_SECRET=' "$DEPLOY_DIR/.env.production"
          grep -q '^COOKIE_SECRET=' "$DEPLOY_DIR/.env.production"
          grep -q '^BAYBLAZE_MEDUSA_SERVICE_TOKEN=' "$DEPLOY_DIR/.env.production"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build TypeScript
        run: |
          npm ci
          npm run build

      - name: Sync release to stable app directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete \
            --exclude .env.production \
            --exclude dist \
            --exclude node_modules \
            --exclude uploads \
            ./ "$DEPLOY_DIR"/
          rm -rf "$DEPLOY_DIR/dist" "$DEPLOY_DIR/node_modules"

      - name: Prepare consolidated runtime state
        run: |
          mkdir -p "$DEPLOY_DIR/uploads" "$DEPLOY_DIR/medusa/uploads"
          if [ -d /opt/bayblaze/medusa/uploads ] && [ ! -e "$DEPLOY_DIR/medusa/uploads/.consolidated-from-legacy" ]; then
            rsync -a /opt/bayblaze/medusa/uploads/ "$DEPLOY_DIR/medusa/uploads"/
            touch "$DEPLOY_DIR/medusa/uploads/.consolidated-from-legacy"
          fi

      - name: Retire legacy standalone Medusa runtime
        run: |
          if [ -d /opt/bayblaze/medusa ]; then
            cd /opt/bayblaze/medusa
            docker compose -f docker-compose.prod.yml down --remove-orphans || \
              docker compose -f docker-compose.yml down --remove-orphans || true
          fi

      - name: Build Docker images
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose -p bayblaze-api -f docker-compose.prod.yml build

      - name: Run Medusa migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose -p bayblaze-api -f docker-compose.prod.yml run --rm medusa npx medusa db:migrate

      - name: Recreate BayBlaze API runtime
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose -p bayblaze-api -f docker-compose.prod.yml up -d --remove-orphans

      - name: Show container status
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose -p bayblaze-api -f docker-compose.prod.yml ps
          docker compose -p bayblaze-api -f docker-compose.prod.yml logs --tail=120 bayblaze-api
          docker compose -p bayblaze-api -f docker-compose.prod.yml logs --tail=120 medusa
