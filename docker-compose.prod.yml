services:
  bayblaze-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bayblaze-api:latest
    container_name: bayblaze-api
    restart: unless-stopped
    env_file:
      - /opt/bayblaze/bayblaze-api/.env.production
    ports:
      - "127.0.0.1:3040:3040"
    volumes:
      - /opt/bayblaze/bayblaze-api/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3040/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
